# JS side is nub-native: nub provisions Node from .node-version (the smoke test needs its type
# stripping, >= 23.6) and runs package.json scripts (`nub run test`). mise only carries nub and the
# deploy glue that reaches into the Vencord checkout.
[tools]
nub = "0.9.6"

[env]
# Vencord source checkout that Vesktop loads (Vesktop settings -> Vencord Location = <this>/dist).
VENCORD_DIR = "{{ get_env(name='VENCORD_DIR', default=env.HOME ~ '/Work/Vencord') }}"

[tasks.deploy]
description = "Copy the plugin into $VENCORD_DIR/src/userplugins/MCPBridge and rebuild Vencord with nub"
run = '''
#!/usr/bin/env bash
set -euo pipefail
dst="$VENCORD_DIR/src/userplugins/MCPBridge"
mkdir -p "$dst"
install -m 600 vencord-plugin/index.tsx vencord-plugin/native.ts vencord-plugin/scope.ts "$dst/"
# nub installs from Vencord's own pnpm-lock.yaml with its embedded engine and leaves the lockfile
# untouched, so the checkout stays identical to upstream.
nub --cwd "$VENCORD_DIR" install --frozen-lockfile
nub --cwd "$VENCORD_DIR" run build
# native.ts runs in Vesktop's main process, so a renderer reload (Cmd+R) does not pick it up.
echo "built $VENCORD_DIR/dist; quit Vesktop (Cmd+Q) and reopen to load the new build"
'''
